<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mah-a-Brain Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0a; color: #e0e0e0; min-height: 100vh; }
    .header { padding: 20px 30px; border-bottom: 1px solid #222; display: flex; align-items: center; gap: 16px; }
    .header h1 { font-size: 20px; font-weight: 600; }
    .status { padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; }
    .status.ok { background: #0f2e1a; color: #4ade80; border: 1px solid #166534; }
    .status.off { background: #2e0f0f; color: #f87171; border: 1px solid #991b1b; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 20px 30px; }
    .panel { background: #111; border: 1px solid #222; border-radius: 12px; padding: 20px; }
    .panel h2 { font-size: 14px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px; }
    .metric { font-size: 36px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .metric.cyan { color: #22d3ee; }
    .metric.green { color: #4ade80; }
    .metric.amber { color: #fbbf24; }
    .chat-area { grid-column: 1 / -1; }
    .log { background: #050505; border: 1px solid #1a1a1a; border-radius: 8px; padding: 16px; height: 300px; overflow-y: auto; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 13px; line-height: 1.6; }
    .log .info { color: #888; }
    .log .chat { color: #22d3ee; }
    .log .error { color: #f87171; }
    .log .event { color: #fbbf24; }
    .input-row { display: flex; gap: 8px; margin-top: 12px; }
    .input-row input { flex: 1; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 12px 16px; color: #fff; font-size: 14px; outline: none; }
    .input-row input:focus { border-color: #22d3ee; }
    .btn { padding: 12px 24px; border-radius: 8px; border: none; font-weight: 600; font-size: 14px; cursor: pointer; transition: all 0.15s; }
    .btn-primary { background: #22d3ee; color: #000; }
    .btn-primary:hover { background: #06b6d4; }
    .btn-amber { background: #fbbf24; color: #000; }
    .btn-amber:hover { background: #f59e0b; }
    .btn-green { background: #4ade80; color: #000; }
    .btn-green:hover { background: #22c55e; }
    .actions { display: flex; gap: 8px; margin-top: 12px; }
    .files-list { max-height: 200px; overflow-y: auto; }
    .file-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-bottom: 1px solid #1a1a1a; }
    .file-row:last-child { border-bottom: none; }
    .file-row a { color: #22d3ee; text-decoration: none; font-size: 13px; }
    .file-row a:hover { text-decoration: underline; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Mah-a-Brain</h1>
    <span id="statusBadge" class="status off">CONNECTING...</span>
  </div>

  <div class="grid">
    <div class="panel">
      <h2>CPU</h2>
      <div id="cpuMetric" class="metric cyan">---%</div>
    </div>
    <div class="panel">
      <h2>Memory Documents</h2>
      <div id="memMetric" class="metric green">---</div>
    </div>

    <div class="panel chat-area">
      <h2>Live Output</h2>
      <div id="log" class="log"></div>
      <div class="input-row">
        <input id="chatInput" type="text" placeholder="Type a prompt and press Enter or click Send..." onkeydown="if(event.key==='Enter')sendChat()">
        <button class="btn btn-primary" onclick="sendChat()">Send</button>
      </div>
      <div class="actions">
        <button class="btn btn-amber" onclick="generateCAD()">Generate CAD</button>
        <button class="btn btn-green" onclick="refreshFiles()">Refresh Files</button>
      </div>
    </div>

    <div class="panel">
      <h2>CAD Files (click to download)</h2>
      <div id="filesList" class="files-list"><span class="info">Click "Refresh Files" to load</span></div>
    </div>
    <div class="panel">
      <h2>System Info</h2>
      <div id="sysInfo" style="font-family: monospace; font-size: 13px; color: #888;">Loading...</div>
    </div>
  </div>

  <script>
    const BASE = window.location.protocol + '//' + window.location.hostname + ':8080';
    const logEl = document.getElementById('log');

    function addLog(msg, cls = 'info') {
      const ts = new Date().toLocaleTimeString();
      const div = document.createElement('div');
      div.className = cls;
      div.textContent = `[${ts}] ${msg}`;
      logEl.appendChild(div);
      logEl.scrollTop = logEl.scrollHeight;
    }

    // WebSocket telemetry
    function connectWS() {
      const ws = new WebSocket(`ws://${window.location.hostname}:8080/ws/telemetry`);
      ws.onopen = () => {
        document.getElementById('statusBadge').className = 'status ok';
        document.getElementById('statusBadge').textContent = 'CONNECTED';
        addLog('Telemetry connected', 'info');
      };
      ws.onmessage = (e) => {
        const data = e.data;
        const cpuMatch = data.match(/cpu=([\d.]+)%/);
        const memMatch = data.match(/mem_docs=(\d+)/);
        if (cpuMatch) document.getElementById('cpuMetric').textContent = cpuMatch[1] + '%';
        if (memMatch) document.getElementById('memMetric').textContent = memMatch[1];
        addLog(data, 'event');
      };
      ws.onclose = () => {
        document.getElementById('statusBadge').className = 'status off';
        document.getElementById('statusBadge').textContent = 'DISCONNECTED';
        addLog('Telemetry disconnected. Reconnecting in 3s...', 'error');
        setTimeout(connectWS, 3000);
      };
      ws.onerror = () => ws.close();
    }
    connectWS();

    // Health check
    async function checkHealth() {
      try {
        const res = await fetch(BASE + '/api/health');
        const data = await res.json();
        document.getElementById('sysInfo').innerHTML =
          `Status: ${data.status}<br>` +
          `Version: ${data.version}<br>` +
          `CPU: ${data.cpu_percent}%<br>` +
          `Ollama: ${data.ollama_available ? 'Yes' : 'No'}<br>` +
          `ChromaDB: ${data.chroma_available ? 'Yes' : 'No'}<br>` +
          `Memory docs: ${data.memory_docs}`;
      } catch (e) {
        document.getElementById('sysInfo').textContent = 'Could not reach server';
      }
    }
    checkHealth();
    setInterval(checkHealth, 10000);

    // Chat
    async function sendChat() {
      const input = document.getElementById('chatInput');
      const prompt = input.value.trim();
      if (!prompt) return;
      input.value = '';
      addLog(`YOU: ${prompt}`, 'chat');
      try {
        const res = await fetch(BASE + '/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt })
        });
        const data = await res.json();
        addLog(`AI: ${data.response}`, 'chat');
        if (data.memory_enhanced) addLog('(response enhanced with past memory)', 'info');
      } catch (e) {
        addLog(`Error: ${e.message}`, 'error');
      }
    }

    // CAD
    async function generateCAD() {
      addLog('Generating CAD model...', 'event');
      try {
        const res = await fetch(BASE + '/api/cad/generate', { method: 'POST' });
        const data = await res.json();
        if (data.status === 'ok') {
          addLog(`CAD generated: ${data.job_id} -- download at ${data.download_url}`, 'chat');
          refreshFiles();
        } else {
          addLog(`CAD error: ${data.message}`, 'error');
        }
      } catch (e) {
        addLog(`Error: ${e.message}`, 'error');
      }
    }

    // File list
    async function refreshFiles() {
      try {
        const res = await fetch(BASE + '/api/cad/list');
        const data = await res.json();
        const el = document.getElementById('filesList');
        if (data.files.length === 0) {
          el.innerHTML = '<span class="info">No files yet. Generate one first.</span>';
          return;
        }
        el.innerHTML = data.files.map(f =>
          `<div class="file-row">
            <span>${f.filename} (${(f.size_bytes / 1024).toFixed(1)} KB)</span>
            <a href="${BASE}${f.download_url}" download>Download</a>
          </div>`
        ).join('');
      } catch (e) {
        document.getElementById('filesList').innerHTML = '<span class="error">Could not load files</span>';
      }
    }
  </script>
</body>
</html>
